<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thali | Daily Meal Pass</title>
  <link rel="stylesheet" href="/theme.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Inline SVG Spritesheet -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
    <symbol id="icon-qr" viewBox="0 0 24 24">
      <rect x="3" y="3" width="6" height="6" fill="currentColor"/>
      <rect x="3" y="15" width="6" height="6" fill="currentColor"/>
      <rect x="15" y="3" width="6" height="6" fill="currentColor"/>
      <rect x="10" y="10" width="4" height="4" fill="currentColor"/>
    </symbol>
    <symbol id="icon-search" viewBox="0 0 24 24">
      <circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="2" fill="none"/>
      <line x1="14" y1="14" x2="20" y2="20" stroke="currentColor" stroke-width="2"/>
    </symbol>
    <symbol id="icon-home" viewBox="0 0 24 24">
      <path d="M3 11 L12 2 L21 11 V21 H3 Z" fill="currentColor"/>
      <rect x="9" y="14" width="6" height="7" fill="currentColor"/>
    </symbol>
    <symbol id="icon-plans" viewBox="0 0 24 24">
      <rect x="3" y="4" width="18" height="18" rx="2" stroke="currentColor" stroke-width="2" fill="none"/>
      <line x1="3" y1="9" x2="21" y2="9" stroke="currentColor" stroke-width="2"/>
      <line x1="7" y1="4" x2="7" y2="2" stroke="currentColor" stroke-width="2"/>
      <line x1="17" y1="4" x2="17" y2="2" stroke="currentColor" stroke-width="2"/>
    </symbol>
    <symbol id="icon-profile" viewBox="0 0 24 24">
      <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="2" fill="none"/>
      <path d="M4 22c0-4 8-6 8-6s8 2 8 6" stroke="currentColor" stroke-width="2" fill="none"/>
    </symbol>
  </svg>

  <div class="home-container">
    <header class="app-bar">
      <h1>Thali</h1>
      <button class="button-icon" aria-label="Search">
        <svg aria-hidden="true"><use href="#icon-search"/></svg>
      </button>
    </header>

    <main>
      <section class="active-plan card">
        <h2>Active Plan</h2>
        <p>No active plan. Tap below to subscribe.</p>
      </section>

      <section class="qr-cta">
        <button class="button-primary" aria-label="Scan Mess QR Code">
          <svg style="width: 20px; height: 20px; margin-right: 8px;" aria-hidden="true"><use href="#icon-qr"/></svg>
          Scan Mess QR Code
        </button>
      </section>

      <section class="todays-menu card">
        <h3>Today's Menu</h3>
        <p>Breakfast: --</p>
        <p>Lunch: --</p>
        <p>Dinner: --</p>
      </section>

      <section class="nearby-messes card">
        <h3>Nearby Messes</h3>
        <p>No nearby messes available.</p>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="Primary Navigation">
      <button class="button-icon" aria-label="Home">
        <svg aria-hidden="true"><use href="#icon-home"/></svg>
      </button>
      <button class="button-icon" aria-label="Plans">
        <svg aria-hidden="true"><use href="#icon-plans"/></svg>
      </button>
      <button class="button-icon" aria-label="Profile">
        <svg aria-hidden="true"><use href="#icon-profile"/></svg>
      </button>
    </nav>
  </div>
</body>
</html>
